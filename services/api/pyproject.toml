[project]
name = "leavesflow-api"
version = "0.1.0"
description = "LeavesFlow MVP V1 FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
